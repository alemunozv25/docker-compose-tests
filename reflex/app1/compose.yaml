services:
  backend:
    build:
      dockerfile: backend.Dockerfile
    ports:
     - 8020:8020
    depends_on:
     - redis
  frontend:
    build:
      dockerfile: frontend.Dockerfile
    ports:
      - 8010:8010
    depends_on:
      - backend
  redis:
    image: redis:8.2.1
    ports:
      - 6379:6379